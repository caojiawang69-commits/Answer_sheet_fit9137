<style>
/* Layout: a Moodle-style quiz navigation rail on the left, one question workspace on the right —
   the quiz question on top, the coach (steps, Wireshark view, legend, answer) underneath. */
:root {
  --bg: #eef2f5;
  --surface: #ffffff;
  --sunk: #f5f7f9;
  --ink: #15202b;
  --muted: #5a6876;
  --line: #d6dee5;
  --accent: #1d6fb8;
  --accent-soft: #e2eefa;
  --good: #1b8549;
  --good-soft: #e3f4ea;
  --bad: #c4302b;
  --bad-soft: #fbe8e7;
  --warn-soft: #fff4d6;
  --code-bg: #e9eef3;
  --mark: #e0362c;
  --font-body: "IBM Plex Sans", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e141a; --surface: #161f28; --sunk: #121a22; --ink: #e4ebf1; --muted: #98a6b3; --line: #273440;
    --accent: #5aa8ea; --accent-soft: #15314a; --good: #4cc27f; --good-soft: #12301f; --bad: #f07e78;
    --bad-soft: #3a1b1a; --warn-soft: #3a3016; --code-bg: #1d2934; --mark: #ef4b40; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e141a; --surface: #161f28; --sunk: #121a22; --ink: #e4ebf1; --muted: #98a6b3; --line: #273440;
  --accent: #5aa8ea; --accent-soft: #15314a; --good: #4cc27f; --good-soft: #12301f; --bad: #f07e78;
  --bad-soft: #3a1b1a; --warn-soft: #3a3016; --code-bg: #1d2934; --mark: #ef4b40; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.6; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface);
  border-bottom: 1px solid var(--line); padding-block: 10px; padding-inline: 16px; }
.top-in { max-width: 1280px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; }
.brand { display: flex; flex-direction: column; min-width: 0; }
.brand b { font-size: 18px; letter-spacing: .01em; }
.brand span { font-family: var(--font-mono); font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
.prog { display: flex; align-items: center; gap: 10px; flex: 1 1 220px; min-width: 0; }
.bar { flex: 1; height: 8px; background: var(--code-bg); border-radius: 99px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--good); transition: width .3s ease; }
.prog span { font-size: 13.5px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.tools { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.toggle { display: inline-flex; gap: 6px; align-items: center; font-size: 13.5px; color: var(--muted); cursor: pointer; }
button { font: inherit; color: inherit; }
.btn-q { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 5px 12px; cursor: pointer; font-size: 13.5px; }
.btn-q:hover { border-color: var(--accent); }
.btn-q.armed { border-color: var(--bad); color: var(--bad); }
button:focus-visible, input:focus-visible, summary:focus-visible, .cell:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { max-width: 1280px; margin: 0 auto; padding-block: 18px 40px; padding-inline: 16px; display: grid;
  grid-template-columns: 230px minmax(0, 1fr); gap: 20px; align-items: start; }
.rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 76px); background: var(--surface); border: 1px solid var(--line);
  border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 12px; max-height: calc(100vh - 100px); overflow: auto; }
.rail-h { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.grp-t { font-size: 13px; font-weight: 600; margin-bottom: 6px; }
.cells { display: flex; flex-wrap: wrap; gap: 6px; }
.cell { min-width: 40px; height: 34px; padding: 0 6px; border: 1.5px solid var(--line); background: var(--surface); border-radius: 6px;
  font-family: var(--font-mono); font-size: 13px; cursor: pointer; font-variant-numeric: tabular-nums; }
.cell:hover { border-color: var(--accent); }
.cell.ok { background: var(--good-soft); border-color: var(--good); color: var(--good); font-weight: 600; }
.cell.bad { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.cell.cur { box-shadow: 0 0 0 2px var(--accent); }
.key { display: flex; flex-wrap: wrap; gap: 10px; font-size: 12px; color: var(--muted); }
.key i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; border: 1.5px solid var(--line); vertical-align: -2px; margin-right: 4px; }
.key .k-ok { background: var(--good-soft); border-color: var(--good); }
.key .k-bad { background: var(--bad-soft); border-color: var(--bad); }

main { min-width: 0; display: flex; flex-direction: column; gap: 16px; }
.crumb { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.crumb b { font-size: 21px; text-wrap: balance; }
.crumb span { color: var(--muted); font-size: 14px; }
.qbox { display: grid; grid-template-columns: 150px minmax(0, 1fr); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
.qmeta { background: var(--sunk); border-right: 1px solid var(--line); padding: 14px; display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
.qmeta b { color: var(--ink); font-size: 15px; }
.qmeta .st-ok { color: var(--good); font-weight: 600; }
.qmeta .st-bad { color: var(--bad); font-weight: 600; }
.qbody { padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.qtext { margin: 0; font-size: 16.5px; max-width: 68ch; }
.af { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.af label { font-size: 14px; color: var(--muted); }
.af input { flex: 1 1 260px; min-width: 0; font-family: var(--font-mono); font-size: 15px; padding: 8px 10px; border: 1.5px solid var(--line);
  border-radius: 6px; background: var(--surface); color: var(--ink); }
.af input.ok { border-color: var(--good); }
.af input.bad { border-color: var(--bad); }
.btn-p { background: var(--accent); color: #fff; border: 0; border-radius: 6px; padding: 8px 18px; font-weight: 600; cursor: pointer; }
.btn-p:hover { filter: brightness(1.08); }
.feedback { border-radius: 8px; padding: 10px 12px; font-size: 14.5px; }
.feedback.ok { background: var(--good-soft); color: var(--ink); border: 1px solid var(--good); }
.feedback.bad { background: var(--bad-soft); color: var(--ink); border: 1px solid var(--bad); }
.feedback b { display: block; margin-bottom: 2px; }
.feedback ul { margin: 4px 0 0; padding-left: 20px; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; min-width: 0; }
.panel h3 { margin: 0 0 10px; font-size: 16px; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.panel h3 small { font-weight: 400; color: var(--muted); font-size: 13px; }
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; counter-reset: s; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 4px 8px; align-items: start; }
.steps li::before { content: counter(s); width: 24px; height: 24px; border-radius: 50%; background: var(--accent-soft); color: var(--accent);
  font-weight: 700; font-size: 13px; display: inline-flex; align-items: center; justify-content: center; margin-top: 1px; }
.steps label { display: flex; gap: 8px; align-items: flex-start; cursor: pointer; }
.steps label input { margin-top: 5px; }
.steps li.done label span { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line); }
.code { grid-column: 2; display: flex; gap: 8px; align-items: center; background: var(--code-bg); border-radius: 6px; padding: 6px 8px 6px 12px; min-width: 0; }
.code code { font-family: var(--font-mono); font-size: 13.5px; flex: 1; overflow-x: auto; white-space: nowrap; }
.copy { border: 1px solid var(--line); background: var(--surface); border-radius: 5px; padding: 2px 10px; font-size: 12.5px; cursor: pointer; flex: none; }

details.see > summary, details.ref > summary { cursor: pointer; font-weight: 600; font-size: 16px; list-style: none; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
details.see > summary::-webkit-details-marker, details.ref > summary::-webkit-details-marker { display: none; }
details.see > summary::before, details.ref > summary::before { content: "▸"; color: var(--muted); }
details[open].see > summary::before, details[open].ref > summary::before { content: "▾"; }
details.see > summary span { font-weight: 400; font-size: 13px; color: var(--muted); }
.figscroll { overflow-x: auto; margin-top: 12px; cursor: zoom-in; border-radius: 8px; }
.figblock + .figblock { margin-top: 18px; }
.figcap { font-size: 13px; color: var(--muted); margin-top: 6px; }
.legend { list-style: none; padding: 0; margin: 12px 0 0; display: flex; flex-direction: column; gap: 6px; }
.legend li { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; color: var(--muted); padding: 3px 6px; border-radius: 6px; }
.legend li.on { color: var(--ink); background: var(--warn-soft); font-weight: 600; }
.mk { display: inline-flex; align-items: center; justify-content: center; width: 21px; height: 21px; border-radius: 50%;
  background: var(--mark); color: #fff; font-weight: 700; font-size: 12.5px; font-family: "IBM Plex Sans", sans-serif; flex: none; line-height: 1; }
.tips { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
.tip { border-radius: 10px; padding: 12px 14px; font-size: 14.5px; border: 1px solid var(--line); background: var(--surface); }
.tip b { display: block; font-size: 13px; letter-spacing: .04em; margin-bottom: 2px; }
.tip.trap { border-color: var(--bad); }
.tip.trap b { color: var(--bad); }
.tip.stuck b { color: var(--accent); }
details.ref .refbody { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
details.ref code.big { font-family: var(--font-mono); font-size: 17px; background: var(--code-bg); padding: 6px 10px; border-radius: 6px; align-self: flex-start; overflow-wrap: anywhere; }
.pager { display: flex; justify-content: space-between; gap: 10px; }
.pager button { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 9px 16px; cursor: pointer; font-weight: 600; }
.pager button:hover { border-color: var(--accent); }
.pager button[disabled] { opacity: .45; cursor: default; }
.ht { width: 100%; border-collapse: collapse; font-size: 14.5px; }
.ht td { padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.ht td:first-child { width: 150px; color: var(--muted); }
.ht input { width: 100%; font-family: var(--font-mono); font-size: 14.5px; padding: 6px 8px; border: 1.5px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); }
.ht input.ok { border-color: var(--good); background: var(--good-soft); }
.ht input.bad { border-color: var(--bad); background: var(--bad-soft); }
.ht td.res { width: 34px; text-align: center; font-weight: 700; }
.ht td.res.ok { color: var(--good); } .ht td.res.bad { color: var(--bad); }
.rowhint { font-size: 13px; line-height: 1.5; color: var(--bad); margin-top: 4px; }
.rowhint:empty { display: none; }
.tablewrap { overflow-x: auto; }

/* lightbox */
.lb { position: fixed; inset: 0; z-index: 20; background: rgba(10, 16, 22, .82); display: flex; flex-direction: column;
  padding: calc(env(safe-area-inset-top, 0px) + 12px) 12px calc(env(safe-area-inset-bottom, 0px) + 12px); }
.lb-bar { display: flex; justify-content: space-between; align-items: center; color: #fff; padding: 0 4px 8px; gap: 10px; }
.lb-bar button { background: #fff; color: #111; border: 0; border-radius: 6px; padding: 6px 14px; font-weight: 600; cursor: pointer; }
.lb-scroll { flex: 1; overflow: auto; background: #fff; border-radius: 8px; padding: 12px; }
.lb-scroll .ws { zoom: 1.3; }

/* ---------- Wireshark-style mockups (a light window, like the real app, in both themes) ---------- */
.ws { width: 900px; color: #1f1f1f; font-family: "Segoe UI", -apple-system, "Helvetica Neue", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 12.5px; line-height: 1.45; }
.ws .win { border: 1px solid #b5b5b5; border-radius: 8px; overflow: hidden; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.15); }
.ws .tb { height: 26px; background: #e6e6e6; border-bottom: 1px solid #cdcdcd; display: flex; align-items: center; padding: 0 10px; color: #333; font-size: 12px; }
.ws .dots { width: 58px; display: flex; gap: 6px; } .ws .dots i { width: 10px; height: 10px; border-radius: 50%; background: #ff5f57; display: block; }
.ws .dots i + i { background: #febc2e; } .ws .dots i + i + i { background: #28c840; }
.ws .tn { flex: 1; text-align: center; margin-right: 58px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ws .mn { padding: 3px 10px; background: #f6f6f6; border-bottom: 1px solid #dcdcdc; word-spacing: 8px; color: #333; }
.ws .fb { display: flex; align-items: center; gap: 8px; padding: 6px 10px; background: #f6f6f6; border-bottom: 1px solid #d3d3d3; }
.ws .fi { flex: 1; font-family: "IBM Plex Mono", Menlo, Consolas, monospace; font-size: 13px; padding: 3px 8px; border: 1px solid #79b879; background: #afffaf; border-radius: 3px; white-space: nowrap; overflow: hidden; color: #111; }
.ws .fi.hot { outline: 2.5px solid #e0362c; outline-offset: 1px; }
.ws .chip { display: flex; gap: 8px; align-items: center; font-size: 13.5px; margin-bottom: 10px; color: #222; }
.ws .chip b.m { font-family: "IBM Plex Mono", Menlo, monospace; }
.ws table.pl { width: 100%; border-collapse: collapse; table-layout: fixed; }
.ws .pl th { text-align: left; font-weight: 600; background: #f2f2f2; border-bottom: 1px solid #cfcfcf; padding: 3px 5px; color: #333; white-space: nowrap; overflow: hidden; }
.ws .pl td { padding: 2px 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; height: 21px; color: #1f1f1f; }
.ws tr.udp td { background: #daeeff; } .ws tr.tcp td { background: #e7e6ff; } .ws tr.http td { background: #e4ffc7; }
.ws tr.arp td { background: #faf0d7; } .ws tr.icmp td { background: #fce0ff; } .ws tr.smtp td { background: #e7e6ff; }
.ws tr.dim td { color: #8d8d8d; }
.ws tr.gap td { background: #fff; color: #999; height: 16px; font-size: 12px; }
.ws tr.sel td { background: #2f6fd6; color: #fff; }
.ws td.g, .ws th.g { padding: 1px 2px; text-align: center; background: #fff !important; overflow: visible; }
.ws td.c { background: #fff !important; color: #d3261c !important; font-weight: 700; overflow: visible; text-overflow: clip; }
.ws td.bx { box-shadow: inset 0 0 0 2.5px #e0362c; }
.ws .ipb { background: #fff1a8; color: #1f1f1f; outline: 2px solid #e0362c; border-radius: 2px; padding: 0 2px; margin-left: 4px; }
.ws .dt { border-top: 1px solid #cdcdcd; padding: 4px 0; font-size: 12.8px; }
.ws .ln { padding: 1.5px 8px 1.5px 0; white-space: nowrap; display: flex; align-items: center; color: #1f1f1f; }
.ws .gut { width: 28px; flex: none; display: flex; justify-content: center; }
.ws .ar { display: inline-block; width: 14px; color: #555; }
.ws .ln.hl { background: #fff1a8; } .ws .ln.sel { background: #cfe0fb; }
.ws .call { color: #d3261c; font-weight: 700; margin-left: 12px; }
.ws .sb { border-top: 1px solid #cdcdcd; background: #efefef; color: #444; padding: 3px 10px; display: flex; justify-content: space-between; font-size: 12px; }
.ws .by { border-top: 1px solid #cdcdcd; font-family: "IBM Plex Mono", Menlo, monospace; font-size: 12.3px; padding: 4px 0; }
.ws .by .off { color: #666; margin-right: 14px; } .ws .by .asc { margin-left: 16px; }
.ws .hb { background: #fff1a8; outline: 2px solid #e0362c; }
.ws .gapv { height: 14px; }
.ws .menuw { display: flex; align-items: flex-start; gap: 0; margin-bottom: 14px; font-size: 13px; }
.ws .mkw { margin-right: 8px; margin-top: 2px; }
.ws .mbox { border: 1px solid #b5b5b5; background: #fbfbfb; box-shadow: 0 2px 6px rgba(0,0,0,.18); border-radius: 4px; padding: 4px 0; min-width: 200px; }
.ws .mbox.sub { margin-top: 104px; min-width: 150px; }
.ws .mi { padding: 3px 14px; display: flex; justify-content: space-between; gap: 16px; color: #222; }
.ws .mi.hot { background: #2f6fd6; color: #fff; }
.ws .mnote { margin: 104px 0 0 14px; color: #d3261c; font-weight: 700; font-size: 13.5px; }
.ws .stream { font-family: "IBM Plex Mono", Menlo, monospace; font-size: 12.3px; padding: 6px 10px; line-height: 1.55; white-space: pre; }
.ws .cli { color: #b5121b; } .ws .srv { color: #1b3fb5; } .ws .dimtxt { color: #888; }
.ws .flagline { display: flex; align-items: center; gap: 6px; }
.ws .flagline .call { font-family: "Noto Sans SC", sans-serif; }
.ws .hlbox { background: #fff1a8; outline: 2px solid #e0362c; border-radius: 2px; }
.ws .mk0 { width: 21px; display: inline-block; }
.ws .btns { display: flex; gap: 8px; justify-content: flex-end; align-items: center; padding: 6px 10px; background: #f3f3f3; border-top: 1px solid #d6d6d6; font-size: 12.5px; }
.ws .btns .lg { flex: 1; color: #555; }
.ws .btn { border: 1px solid #a9a9a9; border-radius: 4px; padding: 2px 12px; background: #fff; color: #222; }
.ws .btn.hot { border-color: #e0362c; box-shadow: 0 0 0 2px #e0362c; font-weight: 700; }
.ws .imgrow { display: flex; gap: 12px; align-items: center; margin-top: 14px; }
.ws .thumb { width: 330px; border: 1px solid #bbb; border-radius: 4px; }
.ws .imgtxt { font-size: 13.5px; color: #222; display: flex; flex-direction: column; gap: 6px; }
.ws .zoom { width: 420px; border: 2.5px solid #e0362c; border-radius: 3px; }

@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .rail { position: static; max-height: none; }
  .qbox { grid-template-columns: minmax(0, 1fr); }
  .qmeta { border-right: 0; border-bottom: 1px solid var(--line); flex-direction: row; flex-wrap: wrap; gap: 4px 14px; }
}
@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
</style>

<header class="top">
  <div class="top-in">
    <div class="brand"><b>第 1 套带练</b><span>apollo_eth0_practice_V1.pcap</span></div>
    <div class="prog"><div class="bar"><i id="barfill"></i></div><span id="progtext">已答对 0 / 33</span></div>

      <label class="toggle"><input type="checkbox" id="hidefig"> 先做后看（图解默认折叠）</label>

</header>

<div class="app">
  <nav class="rail" aria-label="题目导航">
    <div class="rail-h">题目导航</div>
    <div id="groups"></div>
    <div class="key"><span><i></i>未做</span><span><i class="k-ok"></i>答对</span><span><i class="k-bad"></i>答错</span></div>

 "找 Info 里有 intranet.vega.io 的那一行（Protocol 是 DNS）。"}, {"t": "读最左边的 No.。"}], "trap": "紧跟在 DNS 应答后面还有一对 ARP（Who has 172.118.204.20? / 172.118.204.20 is at …），那是在问 Intranet 的 MAC，不是 DNS。顺序是：DNS 查询 → DNS 应答 → ARP 请求 → ARP 回答 → TCP 连接。", "stuck": "同名有 A 和 AAAA 两个应答，要有 IP 的 A 那个。", "why": "这一帧告诉 Apollo intranet 的 IP。", "near": {"394": "帧 394 是 DNS 查询（Apollo 在问），不是应答。应答是 DNS 服务器回过来的那一帧。", "395": "帧 395 是 DNS 查询（Apollo 在问），不是应答。应答是 DNS 服务器回过来的那一帧。", "397": "帧 397 是 AAAA 应答（问的是 IPv6 地址），里面没有 IPv4 地址。用过滤器只留 A 记录。", "398": "帧 398 是 ARP 请求（Who has …），是在问 MAC，不是 DNS 应答。", "399": "帧 399 是 ARP 回答（172.118.204.20 is at …），它给的是 MAC，不是 DNS。题目要的是 DNS 应答：把名字 intranet.vega.io 换成 IP 的那一帧，Protocol 列写 DNS。", "549": "帧 549 是 ARP 请求（Who has …），是在问 MAC，不是 DNS 应答。", "550": "帧 550 是 ARP 回答（172.118.204.135 is at …），它给的是 MAC，不是 DNS。题目要的是 DNS 应答：把名字 intranet.vega.io 换成 IP 的那一帧，Protocol 列写 DNS。"}}, {"id": "4.1", "task": "Task 4 · TCP", "q": "In the TCP connection between Apollo and the organisation's web server: the frame numbers of the three-way handshake (comma separated, no spaces).", "answer": "143,144,145", "kind": "list", "fig": "f4", "look": [1, 2, 3], "steps": [{"t": "先把发往 Web 的帧筛出来：过滤栏输入下面这句，回车。列表里剩下的每一行都是发往 Web（61.143.77.112）的。", "code": "ip.dst == 61.143.77.112"}, {"t": "在列表里随便右键一行（第一行就行）→ 菜单里选 Follow → TCP Stream。"}, {"t": "会弹出一个显示对话内容的窗口，直接点右下角 Close 关掉。"}, {"t": "过滤栏变成 tcp.stream eq 1。", "code": "tcp.stream eq 1"}, {"t": "握手的标志是 SYN：整条连接里只有握手的前两帧带 SYN。用下面的过滤器验证，只会剩 2 行：[SYN] 和 [SYN, ACK]。", "code": "tcp.stream eq 1 && tcp.flags.syn == 1"}, {"t": "第三帧是紧跟在 [SYN, ACK] 后面、Apollo 发的那个 [ACK]：Info 里 Seq=1 Ack=1 Len=0。"}, {"t": "三帧的指纹：Seq=0 → Seq=0 Ack=1 → Seq=1 Ack=1，方向是 Apollo → Web → Apollo，三帧都是 Len=0。对上了再抄 No.。"}], "trap": "中间那些 [ACK]、[PSH, ACK] 不是握手：它们没有 SYN，Seq/Ack 是几百上万的大数，Len 常常不是 0，是在传网页数据。", "stuck": "列表里只有一个方向、帧号跳着走（缺了 [SYN, ACK]）：你点过 Source 等列标题，列表被排序了。点一下 No. 列标题，按帧号从小到大排回来。", "why": "三次握手 = SYN → SYN/ACK → ACK。"}, {"id": "4.2", "task": "Task 4 · TCP", "q": "In the TCP connection "Task 4 · TCP", "q": "The total number of TCP connections in the capture.", "answer": "4", "kind": "int", "fig": "f4", "look": [6], "steps": [{"t": "过滤只带 SYN、不带 ACK 的帧：", "code": "tcp.flags.syn == 1 && tcp.flags.ack == 0"}, {"t": "右下角 Displayed 的数就是连接数。"}], "trap": "不要数包的个数；一条连接只有一个不带 ACK 的 SYN。", "stuck": "也可以用菜单 Statistics → Conversations → TCP 标签页数行数。", "why": "SMTP、Web、External、Intranet 各一条。"}, {"id": "5.1", "task": "Task 5 · HTTP", "q": "The frame number of the HTTP GET request for the image on the external web server.", "answer": "273", "kind": "int", "fig": "f5a", "look": [1, 2], "steps": [{"t": "过滤 External 的请求：", "code": "http.request && ip.dst == 188.21.96.14"}, {"t": "三行 GET：/、/robots.txt、图片。找 GET 后面是 .jpg 的那一行。"}, {"t": "读 No.。"}], "trap": "别填响应帧（388），题目问的是 GET 请求。", "stuck": "分不清哪台是 External：看主机信息表里的 IP。", "why": "请求在前，图片的响应被切成很多段，显示在最后一段。"}, {"id": "5.2", "task": "Task 5 · HTTP", "q": "The full URL of that image.", "answer": "http://www.opal.net/view.jpg", "kind": "url", "fig": "f5a", "look": [2, 6], "steps": [{"t": "选图片的 GET（帧 273），展开 Hypertext Transfer Protocol。"}, {"t": "读 [Full request URI: …]。"}], "trap": "要带 http://，别只填 Host 或只填 /文件名。", "stuck": "看不到 Full request URI：自己拼，http:// + Host + 请求路径。", "why": "完整 URL = 协议 + 主机名 + 路径。"}, {"id": "5.3", "task": "Task 5 · HTTP", "q": "The status code of the response to the request for /robots.txt on the intranet server.", "answer": "404", "kind": "int", "fig": "f5a", "look": [1, 3], "steps": [{"t": "读题拆两样：哪台服务器 → intranet server = Intranet（172.118.204.20）；哪个请求 → request for /robots.txt。"}, {"t": "找请求：只看发给 Intranet 的 HTTP 请求，找 Info 写 GET /robots.txt 的那一行。", "code": "http.request && ip.dst == 172.118.204.20"}, {"t": "单击这一行（帧 407），在左下详情里展开 Hypertext Transfer Protocol，最下面一行是 [Response in frame: 409]，记住 409。"}, {"t": "过滤栏改成 http.response，回车，在列表里找 No. = 409 的那一行。现在的过滤器只显示请求，响应被藏起来了，所以要先换过滤器。", "code": "http.response"}, {"t": "读状态码：Info 里 HTTP/1.1 后面那三位数字；或者展开 HTTP，第一行下面有 Status Code: …。只填数字。"}], "trap": "robots.txt 一共被请求了 3 次（帧 150 发往 Web、帧 269 发往 External、帧 407 发往 Intranet）。过滤器里加 ip.dst == 172.118.204.20，就只剩 Intranet 那一个。", "stuck": "列表太长找不到那个帧号：换过滤器后按 Ctrl+G，输入帧号回车，直接跳过去。", "why": "404 Not Found = 服务器上没有这个文件。robots.txt 是网站可以放在根目录、告诉搜索引擎哪些页面别抓的文件。Apollo 请求了，Intranet 没放这个文件，所以回 404。"}, {"id": "5.4", "task": "Task 5 · HTTP", "q": "The flag shown in the web page of the organisation's web server.", "answer": "5A881841EAC8EB91", "kind": "flag", "fig": "f5b", "look": [1, 2], "steps": [{"t": "读题拆两样：哪台服务器 → organisation's web server = Web（61.143.77.112）；哪个请求 → web page = 网站首页，请求是 GET /（只有一个斜杠）。"}, {"t": "找请求：只看发给 Web 的 HTTP 请求，找 Info 写 GET / 的那一行。另外两行是 /robots.txt 和图片，不是网页。", "code": "http.request && ip.dst == 61.143.77.112"}, {"t": "单击这一行（帧 146），展开 Hypertext Transfer Protocol，最下面一行是 [Response in frame: 148]，记住 148。"}, {"t": "过滤栏改成 http.response，回车，在列表里找 No. = 148 的那一行。现在的过滤器只显示请求，响应被藏起来了，所以要先换过滤器。", "code": "http.response"}, {"t": "读正文：在响应的详情里展开 Line-based text data: text/html，找「The flag you are looking for is …」，抄 16 位。也可以右键 → Follow → HTTP Stream 看。"}], "trap": "flag 在响应的正文里，不在请求里。三台服务器各有一个网页 flag，图片里也各有一个；这题要 Web（www.vega.io）那台的网页。", "stuck": "展开不到 text/html：选中的还是请求，没换到响应。找不到那个帧号：换过滤器后按 Ctrl+G，输入帧号回车。", "why": "flag 写在 HTML 正文里，Info 列看不到。"}, {"id": "5.5", "task": "Task 5 · HTTP", "q": "The flag shown in the image on the intranet server.", "answer": "FA6934EC0367C9E4", "kind": "flag", "fig": "f5b", "look": [3, 4, 5, 6], "steps": [{"t": "菜单 File → Export Objects → HTTP…"}, {"t": "在列表里找 Hostname = intranet.vega.io 的图片（team.jpg）。"}, {"t": "选中 → Save… 存到桌面。"}, {"t": "用看图软件打开，照片里白框中的 16 位就是答案。"}], "trap": "三张图来自三台服务器，文件名不同；一定要看 Hostname 选对。", "stuck": "白框太小看不清：用看图软件放大，注意分清 0 和 D、8 和 B。", "why": "图片 flag 只能导出图片看，抓包列表里没有文字。"}, {"id": "5.6", "task": "Task 5 · HTTP", "q": "The destination MAC address of the frame carrying the first HTTP GET request to the external web server.", "answer": "2c:c9:fc:85:f7:f3", "kind": "mac", "fig": "f5a", "look": [4, 5], "steps": [{"t": "过滤 http.request && ip.dst == 188.21.96.14，第一行就是第一个 GET（帧 265）。", "code": "http.request && ip.dst == 188.21.96.14"}, {"t": "选中它，展开 Ethernet II，读 Destination。"}], "trap": "不是 External 服务器的 MAC（它在外网，抓包里看不到），是路由器的 MAC。", "stuck": "图里展开的是图片请求那一帧；所有发往 External 的帧目的 MAC 都一样。", "why": "MAC 只管下一跳：去别的网络先交给路由器。"}, {"id": "6.1", "task": "Task 6 · SMTP", "q": "The frame number of the DATA command.", "answer": "99", "kind": "int", "fig": "f6", "look": [1, 4], "steps": [{"t": "过滤 smtp。", "code": "smtp"}, {"t": "找 Info 只写 C: DATA 的那一行，读 No.。"}], "trap": "C: DATA fragment 那一帧是邮件内容，不是 DATA 命令。", "stuck": "C: 是 Apollo 发的，S: 是邮件服务器发的；命令都在 C: 行里。", "why": "DATA 命令之后服务器回 354，然后才发正文。"}, {"id": "6.2", "task": "Task 6 · SMTP", "q": "The sender's email address.", "answer": "marcus@vega.io", "kind": "email", "fig": "f6", "look": [1, 2], "steps": [{"t": "过滤 smtp，找 C: MAIL FROM:<…> 那一行。", "code": "smtp"}, {"t": "抄尖括号里面的邮箱。"}], "trap": "不要带 < >，也不要带后面的 SIZE=…。", "stuck": "Info 太长被截断：点开那一帧看完整内容。", "why": "MAIL FROM 是信封上的发件人。"}, {"id": "6.3", "task": "Task 6 · SMTP", "q": "The recipient's email address.", "answer": "olivia_hartley@vega.io", "kind": "email", "fig": "f6", "look": [1, 3], "steps": [{"t": "过滤 smtp，找 C: RCPT TO:<…> 那一行。", "code": "smtp"}, {"t": "抄尖括号里面的邮箱。"}], "trap": "不要带 < >；下划线也要抄对。", "stuck": "收件人可能有好几个：每个 RCPT TO 一行。", "why": "RCPT TO 是信封上的收件人。"}, {"id": "6.4", "task": "Task 6 · SMTP", "q": "The subject of the email.", "answer": "Lab schedule", "kind": "text", "fig": "f6", "look": [6, 7], "steps": [{"t": "过滤栏输入 smtp，回车。", "code": "smtp"}, {"t": "在列表里随便右键一行 → Follow → TCP Stream。"}, {"t": "在弹窗里找 Subject: 那一行，冒号后面就是主题。"}], "trap": "列表的 Info 列里看不到主题，必须用 Follow 看正文。", "stuck": "正文很长：在弹窗下方 Find 框里搜 Subject。", "why": "主题写在邮件头里，跟着 DATA 一起发出去。"}, {"id": "6.5", "task": "Task 6 · SMTP", "q": "The reply code sent by the server after the DATA command.", "answer": "354", "kind": "int", "fig": "f6", "look": [4, 5], "steps": [{"t": "过滤 smtp，找 C: DATA 的下一行 S:。", "code": "smtp"}, {"t": "S: 后面的三位数字就是回复码。"}], "trap" function check(kind, ans, raw, near) {
  const hints = [];
  if (!raw.length) return { ok: false, hints: ["还没填答案。"] };
  if (raw !== raw.trim()) hints.push("前后有多余的空格：考试会直接判错。");
  const v = raw.trim();
  if (kind === "list") {
    if (/\s/.test(v)) hints.push("逗号后面不要加空格。");
    if (/[，、]/.test(v)) hints.push("用英文逗号 , 分隔。");
    const nums = v.split(/[,，、\s]+/).filter(Boolean).map(Number);
    const sorted = [...nums].sort((a, b) => a - b);
    if (nums.join() !== sorted.join()) hints.push("帧号要从小到大排。");
    const want = ans.split(",").length;
    if (nums.length !== want) hints.push(`个数不对：应该有 ${want} 个，你写了 ${nums.length} 个。`);
  }
  if ((kind === "hex" || kind === "flag") && /^0x/i.test(v)) hints.push("不要加 0x。");
  if (kind === "hex" && /^\d+$/.test(v) && parseInt(v, 10) === parseInt(ans, 16)) hints.push("这是括号里的十进制；题目要十六进制（0x 后面那串）。");
  const vh = v.replace(/^0x/i, "");
  if (kind === "hex" && vh.length > ans.length && /^0/.test(vh)) hints.push("多补了前导 0。");
  if (kind === "mac" && /-/.test(v)) hints.push("MAC 用冒号分隔，不用 -。");
  if (kind === "mac" && /_/.test(v)) hints.push("不要填厂商名（如 Apple_xx），填完整的冒号格式。");
  if (kind === "email" && /[<>]/.test(v)) hints.push("邮箱不要带 < >。");
  if (kind === "email" && /size=/i.test(v)) hints.push("SIZE=… 不是邮箱的一部分。");
  if (kind === "url" && !/^http:\/\//i.test(v)) hints.push("URL 要写全，带 http://。");
  if (kind === "int" && /[^\d]/.test(v)) hints.push("只写数字，不带单位或别的字符。");
  if (kind === "ip" && /\s/.test(v)) hints.push("IP 里不要有空格。");
  if (kind === "flag" && v.length !== 16) hints.push(`flag 是 16 位，你写了 ${v.length} 位。`);
  if ((kind === "ip" || kind === "mac") && v.toLowerCase() !== ans.toLowerCase()) {
    const w = (typeof WHO !== "undefined") && WHO[v.toLowerCase()];
    if (w) hints.push(`这是 ${w[0]}${/[\u4e00-\u9fff]$/.test(w[0]) ? "" : " "}的 ${kind === "ip" ? "IP" : "MAC"}，不是这里要的。${w[1]}`);
  }
  const ok = raw === v && v.toLowerCase() === ans.toLowerCase();
  if (!ok && near && near[v]) hints.unshift(near[v]);
  return { ok, hints };
}

function stepsHtml(it) {

  return `<ol class="steps">` + it.steps.map((s, k) => `<li class="${done[k] ? "done" : ""}"><label><input type="checkbox" data-k="${k}" ${done[k] ? "checked" : ""}><span>${esc(s.t)}</span></label>` +

    `<div class="figcap">示意图按 Wireshark 4.x 布局重画，数值取自 ${esc("apollo_eth0_practice_V1.pcap")}。${look.length ? "这题看高亮的编号。" : ""}</div>` +

document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !$("lb").hidden) { closeLb(); return; }
  const tag = (document.activeElement && document.activeElement.tagName) || "";
  if (tag === "INPUT" || tag === "TEXTAREA") return;
  if (e.key === "ArrowRight") go(state.cur + 1);
  if (e.key === "ArrowLeft") go(state.cur - 1);
});
if (state.cur >= ITEMS.length) state.cur = 0;
renderRail(); render();
</script>
